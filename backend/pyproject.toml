[project]
name = "codebase-assistant-backend"
version = "0.1.0"
description = "Codebase Onboarding Assistant — backend (API + ARQ worker)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "asyncpg",
    "arq",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "gitpython>=3.1.55",
    "sentence-transformers>=5.6.1",
    "pgvector>=0.5.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["app"]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["asyncpg", "arq", "arq.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy 2.x ships PEP 695 `type` aliases in its stubs, which mypy rejects under
# python_version 3.11 (our support floor). pgvector / sentence-transformers pull
# numpy in transitively; we never type-check against its internals, so skip
# following into it rather than lowering the target to 3.12.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs a live Postgres and downloads models; skipped when the DB is unreachable",
]
